services:
  db:
    image: postgres:16
    container_name: pizzaria-db
    environment:
      POSTGRES_USER: pizzaria
      POSTGRES_PASSWORD: pizzaria123
      POSTGRES_DB: pizzaria
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # o postgres aplica database/banco.sql no primeiro boot, com o volume vazio:
      # mexeu no esquema, roda "docker compose down -v" antes de subir de novo
      - ./database/banco.sql:/docker-entrypoint-initdb.d/banco.sql:ro

volumes:
  pgdata:
